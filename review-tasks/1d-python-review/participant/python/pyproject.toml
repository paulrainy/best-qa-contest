[project]
name = "best-tester-python-review"
version = "0.1.0"
description = "Код-ревью автотестов конкурса «Лучший тестировщик»"
requires-python = ">=3.10"
dependencies = [
    "pytest==9.1.1",
    "pytest-xdist==3.8.0",
    "requests==2.34.2",
    "PyHamcrest==2.1.0",
    "retrying==1.4.2",
    "allure-pytest==2.16.2",
    "pytest-playwright==0.10.0",
    "playwright==1.63.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --alluredir=build/allure-results --output=build/test-results --screenshot=only-on-failure --tracing=retain-on-failure"
log_cli = false
log_level = "INFO"
log_format = "%(asctime)s %(levelname)s %(name)s - %(message)s"
markers = [
    "smoke: смоук-тесты",
    "regress: регресс",
]
