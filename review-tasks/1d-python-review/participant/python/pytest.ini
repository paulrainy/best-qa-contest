[pytest]
testpaths = tests
addopts = -ra --alluredir=build/allure-results --output=build/test-results --screenshot=only-on-failure --tracing=retain-on-failure
log_cli = false
log_level = INFO
log_format = %(asctime)s %(levelname)s %(name)s - %(message)s
markers =
    smoke: смоук-тесты
    regress: регресс
